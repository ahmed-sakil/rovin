<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="lightGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E58A00"/>
      <stop offset="100%" stop-color="#C25E00"/>
    </linearGradient>
  </defs>

  <!-- Clean Minimal Canvas (Transparent or Crisp Paper) -->
  <rect width="800" height="240" rx="16" fill="#F8FAFC"/>
  <rect x="1" y="1" width="798" height="238" rx="15" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Baseline Datum -->
  <line x1="60" y1="202" x2="740" y2="202" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- LOGO MARK -->
  <g transform="translate(68, 32)">

    <!-- OUTER CHASSIS -->
    <path d="M 52,14 L 120,14 L 160,54 L 160,122 L 120,162 L 52,162 L 12,122 L 12,54 Z" 
          fill="none" 
          stroke="#0F172A" 
          stroke-width="5" 
          stroke-linejoin="miter"/>

    <path d="M 56,22 L 116,22 L 152,58 L 152,118 L 116,154 L 56,154 L 20,118 L 20,58 Z" 
          fill="none" 
          stroke="#CBD5E1" 
          stroke-width="1.5"/>

    <!-- Fasteners -->
    <circle cx="52" cy="14" r="3" fill="#64748B"/>
    <circle cx="120" cy="14" r="3" fill="#64748B"/>
    <circle cx="160" cy="54" r="3" fill="#64748B"/>
    <circle cx="160" cy="122" r="3" fill="#64748B"/>
    <circle cx="120" cy="162" r="3" fill="#64748B"/>
    <circle cx="52" cy="162" r="3" fill="#64748B"/>
    <circle cx="12" cy="122" r="3" fill="#64748B"/>
    <circle cx="12" cy="54" r="3" fill="#64748B"/>

    <!-- Calibrations -->
    <line x1="86" y1="10" x2="86" y2="18" stroke="url(#lightGold)" stroke-width="2" stroke-linecap="round"/>
    <line x1="86" y1="158" x2="86" y2="166" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>

    <!-- INNER STENCIL 'R' -->
    <path d="M 40,42 L 64,42 L 64,134 L 48,134 L 40,126 Z" 
          fill="#0F172A"/>

    <path d="M 72,42 L 116,42 L 136,62 L 136,74 L 116,94 L 72,94 Z M 93,60 L 72,60 L 72,76 L 93,76 L 110,76 L 116,70 L 116,66 L 110,60 Z" 
          fill="#0F172A"/>

    <!-- Amber Gold Kick Leg -->
    <polygon points="72,94 97,94 133,134 105,134 82,109 72,109" 
             fill="url(#lightGold)"/>

    <rect x="122" y="38" width="10" height="3" fill="url(#lightGold)"/>
    <circle cx="132" cy="94" r="2.5" fill="url(#lightGold)"/>

  </g>

  <!-- TYPOGRAPHY: ROVIN -->
  <g transform="translate(268, 130)">
    <text font-family="'Orbitron', 'Inter', -apple-system, sans-serif" 
          font-size="76" 
          font-weight="900" 
          letter-spacing="13" 
          fill="#0F172A">
      ROVIN
    </text>

    <text y="42" 
          font-family="'Inter', -apple-system, sans-serif" 
          font-size="12" 
          font-weight="700" 
          letter-spacing="8" 
          fill="#64748B">
      PRECISION RC &bull; TECH NOVELTIES &bull; DECOR
    </text>

    <!-- Underline -->
    <rect x="0" y="56" width="52" height="3" fill="url(#lightGold)"/>
    <rect x="58" y="56" width="16" height="3" fill="#94A3B8"/>
    <circle cx="82" cy="57.5" r="1.5" fill="#64748B"/>
    <line x1="90" y1="57.5" x2="380" y2="57.5" stroke="#E2E8F0" stroke-width="1"/>
  </g>
</svg>
