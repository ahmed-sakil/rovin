<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="deepCarbonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0F14"/>
      <stop offset="100%" stop-color="#07070A"/>
    </linearGradient>

    <!-- Refined High-Torque Solid Amber Gold -->
    <linearGradient id="refinedGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC837"/>
      <stop offset="70%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#ED6A00"/>
    </linearGradient>

    <!-- Titanium Sheen -->
    <linearGradient id="titaniumSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <!-- Canvas Surface -->
  <rect width="800" height="240" rx="16" fill="url(#deepCarbonBg)"/>

  <!-- Tactical Datum Rule -->
  <line x1="60" y1="202" x2="740" y2="202" stroke="#161822" stroke-width="1.5"/>

  <!-- ==================== LOGO MARK ==================== -->
  <g transform="translate(68, 32)">

    <!-- OUTER CHASSIS: Precision Bevelled Hex-Shield (Clean, Crisp, No Glow) -->
    <path d="M 52,14 L 120,14 L 160,54 L 160,122 L 120,162 L 52,162 L 12,122 L 12,54 Z" 
          fill="none" 
          stroke="#1F2330" 
          stroke-width="5" 
          stroke-linejoin="miter"/>

    <!-- Secondary Inner Tension Rail -->
    <path d="M 56,22 L 116,22 L 152,58 L 152,118 L 116,154 L 56,154 L 20,118 L 20,58 Z" 
          fill="none" 
          stroke="#161922" 
          stroke-width="1.5"/>

    <!-- Precision Machined Corner Rivets / Fasteners -->
    <circle cx="52" cy="14" r="3" fill="#3A4054"/>
    <circle cx="120" cy="14" r="3" fill="#3A4054"/>
    <circle cx="160" cy="54" r="3" fill="#3A4054"/>
    <circle cx="160" cy="122" r="3" fill="#3A4054"/>
    <circle cx="120" cy="162" r="3" fill="#3A4054"/>
    <circle cx="52" cy="162" r="3" fill="#3A4054"/>
    <circle cx="12" cy="122" r="3" fill="#3A4054"/>
    <circle cx="12" cy="54" r="3" fill="#3A4054"/>

    <!-- Top & Bottom Telemetry Calibrations -->
    <line x1="86" y1="10" x2="86" y2="18" stroke="url(#refinedGold)" stroke-width="2" stroke-linecap="round"/>
    <line x1="86" y1="158" x2="86" y2="166" stroke="#3A4054" stroke-width="2" stroke-linecap="round"/>

    <!-- ==================== INNER STENCIL 'R' ==================== -->
    
    <!-- 1. Left Vertical Stanchion (Machined Monolith with bottom bevel) -->
    <path d="M 40,42 L 64,42 L 64,134 L 48,134 L 40,126 Z" 
          fill="url(#titaniumSheen)"/>

    <!-- 2. Upper Mechanical Head / Loop (Aerodynamic Chamfer) -->
    <path d="M 72,42 L 116,42 L 136,62 L 136,74 L 116,94 L 72,94 Z M 93,60 L 72,60 L 72,76 L 93,76 L 110,76 L 116,70 L 116,66 L 110,60 Z" 
          fill="url(#titaniumSheen)"/>

    <!-- 3. High-Torque Suspension Kick-Leg (Razor Sharp Solid Amber Gold, 0 Blur) -->
    <polygon points="72,94 97,94 133,134 105,134 82,109 72,109" 
             fill="url(#refinedGold)"/>

    <!-- 4. Precision Mechanical Notch / Index Pin -->
    <rect x="122" y="38" width="10" height="3" fill="url(#refinedGold)"/>
    <circle cx="132" cy="94" r="2.5" fill="url(#refinedGold)"/>

  </g>

  <!-- ==================== TYPOGRAPHY: ROVIN ==================== -->
  <g transform="translate(268, 130)">
    
    <!-- Wordmark with crisp geometric letterforms and tracking -->
    <text font-family="'Orbitron', 'Inter', -apple-system, sans-serif" 
          font-size="76" 
          font-weight="900" 
          letter-spacing="13" 
          fill="#FFFFFF">
      ROVIN
    </text>

    <!-- Subtitle Category Tagline -->
    <text y="42" 
          font-family="'Inter', -apple-system, sans-serif" 
          font-size="12" 
          font-weight="700" 
          letter-spacing="8" 
          fill="#7E8597">
      PRECISION RC &bull; TECH NOVELTIES &bull; DECOR
    </text>

    <!-- Tactical Precision Underline Assembly -->
    <rect x="0" y="56" width="52" height="3" fill="url(#refinedGold)"/>
    <rect x="58" y="56" width="16" height="3" fill="#2E3344"/>
    <circle cx="82" cy="57.5" r="1.5" fill="#7E8597"/>
    <line x1="90" y1="57.5" x2="380" y2="57.5" stroke="#1A1C26" stroke-width="1"/>

  </g>
</svg>
